
server:
  port: 8080

spring:
  application:
    name: mandi-tracker-api

  datasource:
    url: jdbc:postgresql://localhost:5432/mandi_tracker
    username: postgres
    password: ${Password}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

mandi:
  import:
    api-key: ${Key}
    resource-id: 9ef84268-d588-465a-a308-a864a43d0070
    state: Maharashtra
    district: Sangli
    page-size: 10
    enabled: false
    run-on-startup: true
    cron: "0 0 16 * * *"
